<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked — AgentAura</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0A;
            color: #F5F5F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            text-align: center;
            max-width: 400px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #A0A0A0;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .url {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 6px;
            font-size: 12px;
            color: #EF5350;
            word-break: break-all;
            max-width: 100%;
        }

        .categories {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .category {
            padding: 4px 10px;
            background: #111;
            border: 1px solid #2A2A2A;
            border-radius: 12px;
            font-size: 11px;
            color: #666;
        }

        .back-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 10px 24px;
            background: #EF5350;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .back-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">🛡️</div>
        <h1>Site Blocked for Safety</h1>
        <p>
            AgentAura's browser agent cannot interact with this page because
            it contains sensitive content. This protects your personal data.
        </p>
        <p id="blocked-url" class="url"></p>
        <div class="categories">
            <span class="category">Banking</span>
            <span class="category">Government</span>
            <span class="category">Authentication</span>
            <span class="category">Healthcare</span>
            <span class="category">Internal Pages</span>
        </div>
        <button class="back-btn" id="go-back">Go Back</button>
    </div>

    <script src="blocked.js"></script>
</body>

</html>
