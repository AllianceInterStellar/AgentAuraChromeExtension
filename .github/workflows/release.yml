name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Two releases of the same ref must not race each other, and a release that is half way
# through publishing must not be cancelled by a second one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The version check.yml installs as well; part of the browser cache key.
  PLAYWRIGHT_VERSION: 1.58.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A manual run from a branch would package whatever is on it and publish a release with
      # no tag to point at. Refuse it up front, with the fix in the message.
      - name: Must run on a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Release only runs from a v* tag, and this run is on ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'. Push a tag (git tag v1.2.3 && git push origin v1.2.3), or in Actions → Release → Run workflow choose the tag under 'Use workflow from'."
          exit 1

      # TODO: pin every `uses:` to a commit SHA (`actions/checkout@<sha> # v4`) once the SHAs
      # can be verified against the upstream repositories; a tag can be moved, a SHA cannot.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A tag that disagrees with the manifest ships a package whose filename and whose
      # self-reported version are different numbers. Chrome shows the manifest's.
      - name: Tag and manifest must agree
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version $version"
            exit 1
          fi

      # Only what the browser actually loads. The test scripts and CI config have no business
      # inside a package users install, and Chrome Web Store review asks about unused files.
      - name: Build the package
        id: package
        run: |
          version='${{ steps.version.outputs.version }}'
          name="agentaura-chrome-extension-${version}.zip"
          staging="$RUNNER_TEMP/pkg"
          mkdir -p "$staging"
          cp -R manifest.json popup.html sidepanel.html css icons js pages LICENSE "$staging/"
          # manifest.json has to sit at the root of the zip, not inside a folder.
          (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/$name" . -x '*.DS_Store')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name ($(du -h "$name" | cut -f1))"

      # Everything below inspects the ARTEFACT, not the repository. A package can be broken
      # in ways the source tree is not — a file left out of the copy list is exactly that.
      - name: Inspect the package
        run: |
          name='${{ steps.package.outputs.name }}'
          out="$RUNNER_TEMP/unpacked"
          mkdir -p "$out" && unzip -q "$name" -d "$out"

          fail=0
          for forbidden in test scripts .github README.md .gitignore node_modules; do
            if [ -e "$out/$forbidden" ]; then
              echo "::error::$forbidden was packaged"; fail=1
            fi
          done
          [ -f "$out/manifest.json" ] || { echo "::error::manifest.json is not at the zip root"; fail=1; }

          node --input-type=module -e "
          import { readFileSync, existsSync } from 'node:fs'
          import { join } from 'node:path'
          const root = process.argv[1]
          const m = JSON.parse(readFileSync(join(root, 'manifest.json'), 'utf8'))
          const referenced = [
              m.background?.service_worker,
              m.side_panel?.default_path,
              m.options_page,
              ...Object.values(m.icons ?? {}),
              ...Object.values(m.action?.default_icon ?? {}),
              ...(m.content_scripts ?? []).flatMap(c => c.js ?? []),
          ].filter(Boolean)
          const missing = referenced.filter(f => !existsSync(join(root, f)))
          if (missing.length) {
              for (const f of missing) console.error('::error::packaged manifest references a missing file: ' + f)
              process.exit(1)
          }
          console.log(\`package ok — \${referenced.length} referenced files present inside the zip\`)
          " "$out"
          exit $fail

      # TODO pin: actions/cache@<sha> # v4
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}-chromium

      # The strongest check available without a human: give the unpacked package to a real
      # Chrome and see whether the service worker comes up and the side panel opens. The
      # script lives in scripts/ (outside the package) and is shared with check.yml; playwright
      # is installed in the repository root, where Node resolves it from.
      - name: Install Playwright and a display
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Load the package in Chrome
        run: xvfb-run -a node scripts/load-check.mjs "$RUNNER_TEMP/unpacked"

      # TODO pin: softprops/action-gh-release@<sha> # v2
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          body: |
            Unpacked Chrome extension, version ${{ steps.version.outputs.version }}.

            **Install:** download the zip, extract it, then in Chrome go to
            `chrome://extensions`, enable **Developer mode**, and choose **Load unpacked**
            on the extracted folder.

            The package contains only what the browser loads — no test scripts, no CI
            config. Before publishing, this build was unpacked and loaded into a real
            Chrome to confirm its service worker registers and the side panel opens.

            You will need an AgentAura account and a deployed agent gateway for it to talk to.
